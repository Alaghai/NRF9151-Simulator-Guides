# Micro simulator configuration for nRF9151 DK.
# Supports direct LTE TCP through a provisioned Onomondo SoftSIM and
# serial/Wi-Fi TCP relay through a Windows laptop when LTE-M is unavailable.

# Logging and console
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
# Status/network bursts can exceed the deferred logger's small ring buffer.
# Keep the logger path non-blocking, but leave enough room to avoid dropping
# normal console diagnostics while the UART backend drains the queue.
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Stack/heap
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=30000

# Stack-overflow investigation and runtime thread identification
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_MONITOR=y

# C library support
CONFIG_NEWLIB_LIBC=y

# Nordic modem and LTE link control
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M=y

# Networking and sockets through modem offload for direct LTE mode
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_IPV4=y

# Application support
CONFIG_DEBUG=n
CONFIG_REBOOT=y

# Keep SoftSIM/UICC internals quiet. Simulator INFO messages remain enabled.
CONFIG_SOFTSIM_NRF_DEBUG_LOGS=n
CONFIG_SOFTSIM_LIBS_DEBUG_LOGS=n

# Persistent simulator configuration
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Required internally by Onomondo SoftSIM
CONFIG_NVS=y

# Simulator settings must use FCB, not the NVS settings backend
CONFIG_FCB=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FCB=y
CONFIG_SETTINGS_NVS=n
